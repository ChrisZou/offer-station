<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>求职工作台</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <svg class="symbol-sprite" aria-hidden="true">
      <symbol id="sf-tray" viewBox="0 0 24 24"><path d="M4 5.5h16a1 1 0 0 1 1 1v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11a1 1 0 0 1 1-1Z"/><path d="M3.5 14h5l1.4 2h4.2l1.4-2h5"/></symbol>
      <symbol id="sf-location" viewBox="0 0 24 24"><path d="M12 21s6-6.25 6-12a6 6 0 1 0-12 0c0 5.75 6 12 6 12Z"/><circle cx="12" cy="9" r="2"/></symbol>
      <symbol id="sf-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12h18M10 12v2h4v-2"/></symbol>
      <symbol id="sf-cap" viewBox="0 0 24 24"><path d="m2.5 9 9.5-5 9.5 5-9.5 5-9.5-5Z"/><path d="M6 11.2v5.2c3.4 2.2 8.6 2.2 12 0v-5.2M21.5 9v6"/></symbol>
      <symbol id="sf-chevron" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
      <symbol id="sf-shield" viewBox="0 0 24 24"><path d="M12 2.8c2.7 2 5.1 2.7 8 3.1v5.6c0 4.5-3 7.8-8 9.7-5-1.9-8-5.2-8-9.7V5.9c2.9-.4 5.3-1.1 8-3.1Z"/><path d="m8.7 12 2.1 2.1 4.6-4.7"/></symbol>
      <symbol id="sf-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></symbol>
      <symbol id="sf-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="sf-check" viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></symbol>
      <symbol id="sf-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="sf-collapse" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5 5.5-5"/></symbol>
      <symbol id="sf-xmark" viewBox="0 0 24 24"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></symbol>
    </svg>
    <header class="panel-header">
      <div class="brand">求职工作台</div>
      <div class="header-actions">
        <span class="connection"><i id="connection-dot"></i><span id="connection-text">连接中</span></span>
        <button id="popout-button" class="popout-button" type="button" title="弹出为页面浮窗" aria-label="弹出为页面浮窗">↗ <span>弹出</span></button>
        <button id="settings-button" class="avatar-button" type="button" aria-label="未填写姓名 · 连接设置">访</button>
        <span class="window-controls">
          <button id="floating-collapse" class="floating-control hidden" type="button" aria-label="收起为窄栏" title="收起为窄栏"><svg class="sf-icon"><use href="#sf-collapse" /></svg></button>
          <button id="floating-close" class="floating-close hidden" type="button" aria-label="关闭浮窗" title="关闭浮窗"><svg class="sf-icon"><use href="#sf-xmark" /></svg></button>
        </span>
      </div>
    </header>

    <aside id="settings" class="settings hidden" aria-label="连接设置">
      <label class="mode-setting">打开方式
        <select id="display-mode">
          <option value="floating">页面弹出浮窗（默认）</option>
          <option value="sidepanel">浏览器侧边栏</option>
        </select>
      </label>
      <label class="toggle-setting"><span><strong>打开岗位后自动分析</strong><small>识别完成后立即请求 AI，不复用上一次结果</small></span><input id="auto-match" type="checkbox" checked /></label>
      <label>工作台地址
        <input id="api-base" value="http://localhost:3000" />
      </label>
      <div><button id="save-settings" class="button secondary small" type="button">保存并重连</button></div>
    </aside>

    <main id="app" aria-live="polite">
      <section class="loading-state"><div class="loader"></div><h2>正在识别当前岗位</h2><p>正在读取当前 BOSS 直聘职位页</p></section>
    </main>

    <template id="job-template">
      <section class="panel-section">
        <div class="section-kicker"><span class="kicker-icon"><svg class="sf-icon"><use href="#sf-tray" /></svg></span><strong>当前岗位</strong><span>来自 BOSS 直聘</span></div>
        <article class="job-card">
          <div class="job-title-row"><div class="company-icon">▥</div><div class="job-heading"><h1 data-field="title"></h1><p data-field="company"></p></div><strong class="salary" data-field="salaryText"></strong></div>
          <div class="job-meta-row"><div class="facts"><span><svg class="sf-icon"><use href="#sf-location" /></svg><b data-field="locationText"></b></span></div><button id="save-job" class="save-job-round" type="button" title="收藏岗位" aria-label="收藏岗位"><svg class="sf-icon"><use href="#sf-star" /></svg></button></div>
          <section class="match-card" id="match-card" aria-live="polite">
            <div class="match-main">
              <div class="match-idle"><strong>正在准备岗位能力对照</strong><p>识别岗位后会自动分析需要什么，以及你已经具备什么</p></div>
              <div class="match-result hidden">
                <section class="role-summary"><div class="match-result-head"><strong>这个岗位在做什么</strong><span id="summary-source">本地</span></div><p id="job-summary">正在读取岗位核心工作。</p></section>
                <section class="ability-requirements"><div class="ability-heading"><h3>岗位能力对照</h3><span id="ability-counts"></span></div><div id="ability-loading" class="ability-loading">等待 AI 核对岗位要求与职业档案…</div><div id="ability-comparison" class="ability-comparison hidden"></div></section>
                <section id="hard-risk-group" class="hard-risk-group hidden"><h3 id="hard-risk-title">硬性风险</h3><div id="hard-risks"></div></section>
              </div>
              <div id="match-feedback" class="match-feedback hidden" role="status"></div>
              <button id="run-match" class="match-button" type="button"><svg class="sf-icon"><use href="#sf-chart" /></svg><span>立即分析</span></button>
            </div>
          </section>
          <div class="privacy-note"><svg class="sf-icon"><use href="#sf-shield" /></svg><span>自动分析已开启；识别岗位后会发送岗位信息与职业档案给 AI</span></div>
        </article>
      </section>
    </template>

    <template id="failure-template">
      <section class="failure">
        <span class="neutral-badge">未识别到岗位</span>
        <div class="failure-icon">⌕</div>
        <h1>暂时没有识别到职位详情</h1>
        <p>请打开 BOSS 直聘职位详情页后重试</p>
        <button id="retry-button" class="button primary wide" type="button">重新识别</button>
        <button id="show-manual" class="button secondary wide" type="button">手动粘贴 JD</button>
        <form id="manual-form" class="manual-form hidden">
          <label>职位名称<input name="title" required placeholder="请输入职位名称" /></label>
          <label>公司名称<input name="company" required placeholder="请输入公司名称" /></label>
          <div class="two-columns"><label>薪资<input name="salaryText" placeholder="8–13K" /></label><label>地点<input name="locationText" placeholder="杭州" /></label></div>
          <label>岗位描述<textarea name="jobDescription" rows="6" placeholder="粘贴完整 JD"></textarea></label>
          <button class="button primary wide" type="submit">收藏到工作台</button>
        </form>
        <div class="reason-box"><strong>ⓘ 可能的原因</strong><ul><li>页面仍在加载</li><li>当前页面不是职位详情</li><li>页面结构发生变化</li></ul></div>
        <p class="safety">♢ 不会读取聊天记录、Cookie 或联系方式</p>
      </section>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
